<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TabVault</title>
    <link rel="icon" href="icons/icon.png" />
    <link rel="stylesheet" href="vault.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.png" alt="" width="28" height="28" />
        <h1>TabVault</h1>
      </div>
      <div class="actions">
        <button id="stash-all" class="btn btn-primary">Stash all open tabs</button>
        <button id="restore-all" class="btn">Restore everything</button>
        <button id="export" class="btn btn-ghost">Export</button>
        <button id="import-btn" class="btn btn-ghost">Import</button>
        <input id="import-file" type="file" accept="application/json" hidden />
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="settings card">
      <div>
        <strong>Auto-suspend inactive tabs</strong>
        <p class="muted">Frees memory by discarding tabs you haven't used in a while. They reload instantly when clicked.</p>
      </div>
      <div class="settings-controls">
        <label class="switch">
          <input id="suspend-enabled" type="checkbox" />
          <span class="slider"></span>
        </label>
        <label class="inline">After
          <input id="suspend-minutes" type="number" min="1" max="600" />
          minutes
        </label>
      </div>
    </section>

    <main id="groups"></main>

    <template id="group-tpl">
      <article class="group card">
        <header class="group-head">
          <input class="group-name" placeholder="Untitled group" />
          <span class="group-meta"></span>
          <div class="group-actions">
            <button class="btn btn-sm restore-group">Restore all</button>
            <button class="btn btn-sm btn-ghost delete-group">Delete</button>
          </div>
        </header>
        <ul class="tab-list"></ul>
      </article>
    </template>

    <script src="vault.js"></script>
  </body>
</html>
